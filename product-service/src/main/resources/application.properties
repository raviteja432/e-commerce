# Server configuration
server.port=8083
spring.application.name=product-service

# Database configuration
# NOTE: Update the database username and password with your local MySQL credentials.
# [EDIT REQUIRED]: Update database username/password here
spring.datasource.url=jdbc:mysql://localhost:3306/ecom_product?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Deep@1812231
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT validation secret (Must match the secret used in auth-service and gateway)
# [EDIT REQUIRED]: Set your own long random secret key here
jwt.secret=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437

# Inter-service REST endpoints
auth.service.url=http://localhost:8081
vendor.service.url=http://localhost:8082

# AWS S3 file storage properties (For product image uploads)
# NOTE: Update these properties with your actual AWS S3 credentials.
# [EDIT REQUIRED]: Provide your AWS access key, secret key, S3 region, and bucket name
aws.accessKeyId=${AWS_ACCESS_KEY_ID:your_aws_access_key}
aws.secretKey=${AWS_SECRET_ACCESS_KEY:your_aws_secret_key}
aws.region=ap-south-1
aws.s3.bucketName=product-demo-bk

# Logging configuration
logging.level.com.ecommerce=DEBUG

# Redis Configuration (Product Cache on Port 6379)
spring.data.redis.host=localhost
spring.data.redis.port=6379


# Local file upload fallback (used when S3 bucket has Block Public Access enabled)
# Images are stored under this directory and served at /uploads/**
upload.dir=uploads
server.base-url=http://localhost:8080

# Serve uploaded files as static resources
spring.web.resources.static-locations=classpath:/static/,file:uploads/
spring.web.resources.add-mappings=true
