# Server configuration — Cart Service runs on port 8084
server.port=8084
spring.application.name=cart-service

# MySQL Database configuration
# [EDIT REQUIRED]: Update username and password to match your local MySQL setup
spring.datasource.url=jdbc:mysql://localhost:3306/ecom_cart?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Deep@1812231
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# URL of Product Service — used to validate stock before adding to cart
product.service.url=http://localhost:8083

# Logging
logging.level.com.ecommerce=DEBUG

# Redis Configuration (Cart Store on Port 6380)
spring.data.redis.host=localhost
spring.data.redis.port=6380

