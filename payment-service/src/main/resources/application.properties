spring.application.name=payment-service

# Payment service runs on port 8086
server.port=8086

# ─────────────────────────────────────────────────────────────────────────────
# MySQL — ecom_payment database
# ─────────────────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/ecom_payment?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Deep@1812231
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ─────────────────────────────────────────────────────────────────────────────
# Stripe API Credentials
# Replace with your actual Stripe test keys from https://dashboard.stripe.com
# ─────────────────────────────────────────────────────────────────────────────
stripe.secret.key=${STRIPE_SECRET_KEY:sk_test_placeholder_key}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:whsec_placeholder_secret}
# Platform commission — 10% kept by platform, 90% goes to vendor
platform.fee.percentage=10


# ─────────────────────────────────────────────────────────────────────────────
# Internal Service URLs
# ─────────────────────────────────────────────────────────────────────────────
order.service.url=http://localhost:8085
notification.service.url=http://localhost:8087
vendor.service.url=http://localhost:8082
auth.service.url=http://localhost:8081

# Logging
logging.level.com.ecommerce.payment=DEBUG

# Kafka Producer Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
kafka.topic.payment-completed=payment_completed

