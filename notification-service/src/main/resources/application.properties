spring.application.name=notification-service

# Notification service runs on port 8087
server.port=8087

# ─────────────────────────────────────────────────────────────────────────────
# Email Configuration (Gmail SMTP)
# Same credentials as auth-service
# ─────────────────────────────────────────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=mirchipotlam@gmail.com
spring.mail.password=jpuusxehrcvinjsm
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Email sender name displayed in the From field
app.mail.from-name=E-Commerce Store

# Frontend URL used in email links (order details, invoice, etc.)
app.frontend.url=http://localhost:8080

# Logging
logging.level.com.ecommerce.notification=DEBUG

# Kafka Consumer Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
kafka.topic.order-completed=order_completed
kafka.topic.payment-completed=payment_completed

