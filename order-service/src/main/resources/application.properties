# Server Port — Order Service runs on port 8085
server.port=8085
spring.application.name=order-service

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/ecom_order?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Deep@1812231
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Internal Service URLs for inter-service REST calls
auth.service.url=http://localhost:8081
product.service.url=http://localhost:8083
cart.service.url=http://localhost:8084
payment.service.url=http://localhost:8086
notification.service.url=http://localhost:8087

# Logging configuration
logging.level.com.ecommerce=DEBUG

# Kafka Producer Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
kafka.topic.order-completed=order_completed

